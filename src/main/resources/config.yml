# AnimatedDoors configuration

animation:
  # Total time the door takes to swing open/closed, in server ticks (20 ticks = 1 second).
  duration-ticks: 40
  # How many ticks between each animation keyframe. Lower = smoother but more work.
  # Must divide reasonably into duration-ticks. 2 is a good default.
  step-ticks: 2

triggers:
  # Right-clicking any block that belongs to a door toggles it (requires animateddoors.toggle).
  click-door-to-toggle: true
  # Cooldown (in ticks) before the same door can be toggled again. Prevents redstone spam / double-fires.
  cooldown-ticks: 10

restrictions:
  # If true, a door refuses to move while any container inside it (chest, barrel, furnace,
  # hopper, shulker box, etc.) still holds items. This protects their contents, which are not
  # preserved during a swing. Empty containers move freely.
  block-filled-containers: true

selection:
  # Material of the selection wand given by /door wand.
  wand-material: BLAZE_ROD
  # Display name of the wand. MiniMessage formatting is supported (<gold>, <bold>, <#ff8800>, ...).
  wand-name: "<gold>Door Wand"
  # Optional lore lines shown under the name. Same formatting as wand-name.
  wand-lore:
    - "<gray>Left-click: corner 1"
    - "<gray>Right-click: corner 2"
  # If true, only wands handed out by /door wand select corners — they carry a hidden tag, so an
  # ordinary item of the same material is just an ordinary item. Set to false to let any item of
  # wand-material act as a wand (the behaviour before wands were named).
  strict-wand: true
