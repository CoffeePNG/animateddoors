# DynamicDoors configuration

storage:
  # Doors are data, not configuration: each one is written to doors.yml as a single compact,
  # gzipped, Base64 string (blocks are stored as a bitmask over the door's bounding box, so a
  # per-block door costs bytes instead of hundreds of lines). Set this to false to write the old
  # readable layout instead when you need to inspect or hand-edit a door. Both layouts load, so
  # you can flip this at any time — the next save rewrites every door in the chosen format.
  compact: true

animation:
  # Total time the door takes to swing open/closed, in server ticks (20 ticks = 1 second).
  duration-ticks: 40
  # How many ticks between each animation keyframe. Lower = smoother but more work.
  # Must divide reasonably into duration-ticks. 2 is a good default.
  step-ticks: 2

triggers:
  # Right-clicking any block that belongs to a door toggles it (requires dynamicdoors.toggle).
  click-door-to-toggle: true
  # Cooldown (in ticks) before the same door can be toggled again. Prevents redstone spam / double-fires.
  cooldown-ticks: 10

power-block:
  # A door's power block is its control point: power it with a lever, button or redstone and the
  # door toggles. Set one with /door powerblock <name> while looking at the block.
  material: GOLD_BLOCK
  # Only accept (and keep obeying) a power block that is actually made of the material above.
  # With this off, any block can be bound as a power block.
  require-material: true
  # Refuse to let power blocks be broken, burned or blown up. Admins can sneak-break one to unbind it.
  protect: true
  # Right-clicking a power block toggles its door, no redstone needed.
  click-to-toggle: true
  # /door wand also hands out one power block to place.
  give-with-wand: true

restrictions:
  # If true, a door refuses to move while any container inside it (chest, barrel, furnace,
  # hopper, shulker box, etc.) still holds items. This protects their contents, which are not
  # preserved during a swing. Empty containers move freely.
  block-filled-containers: true

  # What happens when something is standing where the door would land:
  #   block     - the door refuses to move and the blocks in the way glow red (default)
  #   overwrite - the door moves anyway and destroys whatever is there
  obstruction: block

  # Keep the world from reacting to a door while it moves. The door's own block writes never
  # notify their neighbours, so torches, redstone, fences and attached blocks around it are left
  # exactly as they are. This additionally freezes block updates ON the cells the door passes
  # through for the length of the move, so fluids, falling sand, scheduled ticks and other plugins
  # can't rewrite them mid-animation. Turn it off to let vanilla behave normally.
  suppress-block-updates: true
  # Extra ticks to keep that freeze after the blocks land, catching updates queued during the move.
  update-guard-grace-ticks: 2

selection:
  # Material of the selection wand given by /door wand.
  wand-material: BLAZE_ROD
  # How the wand starts out for each player:
  #   block  - right-click adds a single block, left-click removes it (shift-click sets box
  #            corners for /door add and /door sub). Only the blocks you pick belong to the door.
  #   region - classic two-corner box; everything solid inside it becomes part of the door.
  default-mode: block
  # Most blocks a single /door attach scan will pull in, so a scan can't run away across a build.
  attach-limit: 256

preview:
  # Master switch for the glowing selection outlines and ghost motion previews.
  enabled: true
  # How long the /door finish preview stays up, in ticks.
  duration-ticks: 200
  # How long the outline shown after each wand click stays up, in ticks.
  live-duration-ticks: 100
  # How long a /door preview ghost lingers at its destination after the move, in ticks.
  hold-ticks: 40
  # Selections larger than this are not previewed (each block is a display entity).
  max-blocks: 2000
