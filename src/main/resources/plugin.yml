name: DynamicDoors
version: '${project.version}'
main: com.coffeepng.dynamicdoors.DynamicDoorsPlugin
api-version: '1.21'
description: Usable animated doors triggered by redstone or floating click-triggers.
author: coffeepng
commands:
  door:
    description: Create and control animated doors.
    usage: /door help
    aliases: [ddoor, dynamicdoor]
    permission: dynamicdoors.use
permissions:
  dynamicdoors.use:
    description: Base permission to use DynamicDoors commands.
    default: op
  dynamicdoors.admin:
    description: Create, edit and remove doors.
    default: op
    children:
      dynamicdoors.use: true
  dynamicdoors.toggle:
    description: Toggle doors via triggers / clicking.
    default: true
